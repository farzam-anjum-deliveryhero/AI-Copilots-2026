name: Encrypt with StatiCrypt

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install StatiCrypt
        run: npm install -g staticrypt

      - name: Encrypt index.html
        run: staticrypt index.html --password "${{ secrets.PAGE_PASSWORD }}" --short --remember 0 -d .

      - name: Commit encrypted file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Encrypt page"
          git push
